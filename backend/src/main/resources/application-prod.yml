# Production profile skeleton.
# All values are env-var-driven; nothing sensitive lives in source.
# Filled out in Session 12 (DO + Alicloud deployment configs).

spring:
  webflux:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:25}
      minimum-idle: ${DB_POOL_MIN:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

godance:
  region: ${REGION}            # MUST be set in prod: digitalocean | alicloud
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.godance.ai}
  object-storage:
    endpoint:         ${OBJECT_STORAGE_ENDPOINT}     # REQUIRED
    region:           ${OBJECT_STORAGE_REGION:us-east-1}
    access-key:       ${OBJECT_STORAGE_ACCESS_KEY}   # REQUIRED
    secret-key:       ${OBJECT_STORAGE_SECRET_KEY}   # REQUIRED
    bucket:           ${OBJECT_STORAGE_BUCKET}       # REQUIRED
    presign-ttl:      ${OBJECT_STORAGE_PRESIGN_TTL:7d}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE:false}    # AWS S3 uses virtual-hosted style; flip for MinIO/Spaces in path-style
  jwt:
    secret: ${JWT_SIGNING_KEY}           # REQUIRED — fail-fast if unset (no fallback)
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: ${JWT_ISSUER:https://godance.ai}
  stripe:
    secret-key:     ${STRIPE_SECRET_KEY}        # REQUIRED
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}    # REQUIRED
    success-url:    ${STRIPE_SUCCESS_URL}
    cancel-url:     ${STRIPE_CANCEL_URL}
    api-base:       ${STRIPE_API_BASE:}         # blank → Stripe SDK default (api.stripe.com)
  coinbase:
    api-key:        ${COINBASE_API_KEY}              # REQUIRED
    webhook-secret: ${COINBASE_WEBHOOK_SECRET}       # REQUIRED
    api-base:       ${COINBASE_API_BASE:https://api.commerce.coinbase.com}
    api-version:    ${COINBASE_API_VERSION:2018-03-22}
  billing:
    topup-min-cents: ${TOPUP_MIN_CENTS:100}
    topup-max-cents: ${TOPUP_MAX_CENTS:100000}
    currency:        ${BILLING_CURRENCY:usd}
    text-markup-percent:  ${TEXT_MARKUP_PERCENT:5}
    image-markup-percent: ${IMAGE_MARKUP_PERCENT:5}
    video-markup-percent: ${VIDEO_MARKUP_PERCENT:5}
  providers:
    openai:
      api-key:  ${OPENAI_API_KEY}              # REQUIRED — single platform key
      api-base: ${OPENAI_API_BASE:https://api.openai.com}
      timeout:  ${OPENAI_TIMEOUT:30s}
    anthropic:
      api-key:     ${ANTHROPIC_API_KEY}        # REQUIRED
      api-base:    ${ANTHROPIC_API_BASE:https://api.anthropic.com}
      api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
      timeout:     ${ANTHROPIC_TIMEOUT:60s}
    google:
      api-key:  ${GOOGLE_API_KEY}              # REQUIRED
      api-base: ${GOOGLE_API_BASE:https://generativelanguage.googleapis.com}
      timeout:  ${GOOGLE_TIMEOUT:60s}
    bfl:
      api-key:       ${BFL_API_KEY}            # REQUIRED
      api-base:      ${BFL_API_BASE:https://api.bfl.ai}
      poll-interval: ${BFL_POLL_INTERVAL:2s}
      poll-timeout:  ${BFL_POLL_TIMEOUT:300s}
    volcengine:
      api-key:       ${VOLCENGINE_API_KEY}     # REQUIRED
      api-base:      ${VOLCENGINE_API_BASE:https://ark.cn-beijing.volces.com}
      poll-interval: ${VOLCENGINE_POLL_INTERVAL:5s}
      poll-timeout:  ${VOLCENGINE_POLL_TIMEOUT:600s}
  gateway:
    fallback-chains:
      gpt-4o:                       [gpt-4o-mini]
      gpt-4.1:                      [gpt-4o]
      claude-3-5-sonnet-20241022:   [claude-3-5-haiku-20241022, gpt-4o]
      gemini-1.5-pro:               [gemini-1.5-flash, gpt-4o-mini]

logging:
  level:
    root: INFO
    ai.godance: INFO
