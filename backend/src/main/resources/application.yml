spring:
  application:
    name: godance
  profiles:
    default: dev
  main:
    web-application-type: reactive
  webflux:
    problemdetails:
      enabled: true     # CLAUDE.md: all HTTP errors as application/problem+json
  jackson:
    # Spring Boot 4 moved to Jackson 3, whose defaults differ from Jackson 2's
    # (e.g. FAIL_ON_NULL_FOR_PRIMITIVES, alphabetical property order). Keep the
    # OpenAI-compatible wire format exactly as it was; adopting Jackson 3
    # defaults is a deliberate, separate change.
    use-jackson2-defaults: true
  datasource:
    url: jdbc:postgresql://localhost:5433/godance   # host 5433 → docker pg 5432 (see docker-compose.yml)
    username: godance
    password: godance
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  quartz:
    # Store-agnostic settings. The JDBC job store (dev/prod) is configured in
    # the profile-specific document at the end of this file; the `test` profile
    # swaps job-store-type to `memory` — see application-test.yml.
    job-store-type: jdbc
    properties:
      org.quartz.scheduler.instanceName: godance-scheduler
      org.quartz.scheduler.instanceId:   AUTO
      org.quartz.threadPool.threadCount: "4"
      org.quartz.jobStore.misfireThreshold: "60000"   # 1 min — auto-recharge can wait that long
  data:
    redis:
      host: localhost
      port: 6380   # docker-compose maps host 6380 → container 6379 (see docker-compose.yml)
      repositories:
        enabled: false   # we use Redis for caching/rate-limits, not Spring Data Redis repositories
                         # — silences strict-mode scanner warnings on JpaRepository interfaces

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    git:
      mode: full
    build:
      enabled: true

# Godance-local conventions consumed by the app
godance:
  region: ${REGION:local}
  security:
    # CORS allow-list for browser-origin /v1/** calls. Comma-separate via env;
    # prod must include https://app.godance.ai.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  rate-limit:
    # Fixed-window Redis counters on the pre-auth endpoints (RateLimiter).
    # Over a limit → 429 problem+json with Retry-After. Fails open if Redis
    # is unreachable. Per-IP limits use X-Forwarded-For as set by Caddy.
    enabled: true
    login-per-ip:       { requests: 30, window: 15m }   # credential stuffing across many accounts
    login-per-email:    { requests: 10, window: 15m }   # password guessing against one account
    signup-per-ip:      { requests: 10, window: 1h }    # each signup sends a verification email
    verify-per-ip:      { requests: 30, window: 15m }
    # Each forgot-password / resend-verification request can send an email.
    forgot-per-ip:      { requests: 10, window: 1h }
    forgot-per-email:   { requests: 5,  window: 24h }   # a handful of reset emails per address per day
    resend-per-ip:      { requests: 10, window: 1h }
    resend-per-account: { requests: 5,  window: 24h }   # a handful of verification emails per account per day
  object-storage:
    endpoint:         ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region:           ${OBJECT_STORAGE_REGION:us-east-1}   # MinIO accepts any placeholder
    access-key:       ${OBJECT_STORAGE_ACCESS_KEY:godance}
    secret-key:       ${OBJECT_STORAGE_SECRET_KEY:godancepw}
    bucket:           ${OBJECT_STORAGE_BUCKET:godance-dev}
    presign-ttl:      ${OBJECT_STORAGE_PRESIGN_TTL:7d}     # SigV4 max
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE:true}    # true for MinIO, false for AWS S3 prod
  jwt:
    # Dev-only default (must be ≥ 32 bytes for HS256). Override in prod via env var.
    secret: ${JWT_SIGNING_KEY:dev-only-do-not-use-in-prod-godance-jwt-signing-key-must-be-32-bytes}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: ${JWT_ISSUER:https://godance.ai}   # must be URI per RFC 7519 `iss` claim
  oauth:
    # Social sign-in (Google / Apple / X) alongside email+password. The dev
    # defaults below are placeholders — they let the context boot but do not
    # enable a working login. Operators set the real credentials via env.
    # SPA callback the minted JWT is handed to (in the URL fragment).
    post-login-redirect-uri: ${OAUTH_POST_LOGIN_REDIRECT_URI:http://localhost:5173/oauth/callback}
    google:
      client-id:     ${GOOGLE_OAUTH_CLIENT_ID:dev-google-client-id}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:dev-google-client-secret}
    apple:
      # Apple's OAuth client_secret is a generated ES256 JWT — supply the
      # Services ID, Team ID, Key ID and the .p8 private-key contents.
      client-id:   ${APPLE_OAUTH_CLIENT_ID:dev.godance.signin}
      team-id:     ${APPLE_OAUTH_TEAM_ID:DEV0TEAM00}
      key-id:      ${APPLE_OAUTH_KEY_ID:DEV0KEY000}
      private-key: ${APPLE_OAUTH_PRIVATE_KEY:}
    x:
      client-id:     ${X_OAUTH_CLIENT_ID:dev-x-client-id}
      client-secret: ${X_OAUTH_CLIENT_SECRET:dev-x-client-secret}
  stripe:
    secret-key:     ${STRIPE_SECRET_KEY:sk_test_dev_dummy_key_do_not_use_for_real_calls}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dev_dummy_webhook_secret_do_not_use_for_real_calls}
    success-url:    ${STRIPE_SUCCESS_URL:http://localhost:8080/billing/success}
    cancel-url:     ${STRIPE_CANCEL_URL:http://localhost:8080/billing/cancel}
    api-base:       ${STRIPE_API_BASE:}        # leave blank in dev/prod; set in tests to redirect to WireMock
  nowpayments:
    api-key:     ${NOWPAYMENTS_API_KEY:np_dev_dummy_key_do_not_use_for_real_calls}
    ipn-secret:  ${NOWPAYMENTS_IPN_SECRET:np_dev_dummy_ipn_secret_do_not_use_for_real_calls}
    api-base:    ${NOWPAYMENTS_API_BASE:https://api.nowpayments.io}
    success-url: ${NOWPAYMENTS_SUCCESS_URL:http://localhost:8080/billing/success}
    cancel-url:  ${NOWPAYMENTS_CANCEL_URL:http://localhost:8080/billing/cancel}
  binancepay:
    enabled:     ${BINANCE_PAY_ENABLED:false}    # v1.1 rail — flagged off until merchant KYC clears
  admin:
    # Operator allowlist for /v1/admin/** endpoints. Single-tenant, so we
    # match on the caller's account email — no is_admin column on users.
    # The account must have verified that email; API keys never pass.
    # Comma-separated in env; empty default = fail-closed.
    emails: ${GODANCE_ADMIN_EMAILS:}
  mail:
    # Transactional email via Resend. The dummy default keeps dev/CI on the
    # [email-stub] logging sender; any real key activates real sends.
    api-key:  ${RESEND_API_KEY:re_dev_dummy_key_do_not_use_for_real_calls}
    from:     ${EMAIL_FROM:Godance <noreply@godance.ai>}
    api-base: ${RESEND_API_BASE:https://api.resend.com}   # override in tests to point at WireMock
    # SPA origin for links in emails (/verify-email, /reset-password).
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
  pricing:
    # Daily catalog drift detection + staging. Region-gated to
    # DIGITALOCEAN inside the cron job (Alicloud must not double-fire).
    refresh-cron:         ${PRICING_REFRESH_CRON:0 0 4 * * ?}     # 04:00 UTC daily; one hour after auto-recharge
    noise-threshold-pct:  ${PRICING_NOISE_THRESHOLD_PCT:1.0}
    min-microcents:       ${PRICING_MIN_MICROCENTS:1}
    max-multiplier:       ${PRICING_MAX_MULTIPLIER:10.0}
    llm-fallback-model-id: ${PRICING_LLM_FALLBACK_MODEL:gemini-3.1-flash-lite}
    llm-fallback-max-pages-per-run: ${PRICING_LLM_FALLBACK_MAX_PAGES:20}
    llm-fallback-fetch-timeout:     ${PRICING_LLM_FALLBACK_FETCH_TIMEOUT:15s}
    page-allowlist-regex: []
    feeds:
      openrouter-url: ${PRICING_OPENROUTER_URL:https://openrouter.ai/api/v1/models}
      litellm-url:    ${PRICING_LITELLM_URL:https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
    alias-map:
      # Upstream id → Godance model_name. Curated for the feed entries our
      # catalog actually cares about; unknown ids fall back to bare-id +
      # family-stem inference in ModelAliasResolver.
      openrouter:
        "anthropic/claude-opus-4-7":       claude-opus-4-7
        "anthropic/claude-sonnet-4-6":     claude-sonnet-4-6
        "anthropic/claude-haiku-4-5":      claude-haiku-4-5
        "openai/gpt-5.5":                  gpt-5.5
        "openai/gpt-5.4":                  gpt-5.4
        "openai/gpt-5.4-nano":             gpt-5.4-nano
        "openai/gpt-4o":                   gpt-4o
        "openai/gpt-4o-mini":              gpt-4o-mini
        "openai/gpt-4.1":                  gpt-4.1
        "google/gemini-3.1-pro":           gemini-3.1-pro
        "google/gemini-3.1-flash-lite":    gemini-3.1-flash-lite
        "google/gemini-1.5-pro":           gemini-1.5-pro
        "google/gemini-1.5-flash":         gemini-1.5-flash
        "deepseek/deepseek-v4-pro":        deepseek-v4-pro
        "deepseek/deepseek-v4-flash":      deepseek-v4-flash
        "xai/grok-4":                      grok-4
        "qwen/qwen-3.6":                   qwen-3.6
        "qwen/qwen-3.6-coder":             qwen-3.6-coder
        "moonshotai/kimi-k2.6":            kimi-k2.6
        "zhipuai/glm-4.7-flash":           glm-4.7-flash
        "minimax/minimax-m2.7":            minimax-m2.7
      litellm:
        claude-opus-4-7-20251220:          claude-opus-4-7
        deepseek-v4-pro:                   deepseek-v4-pro
        "1024-x-1024/seedream-5.0":        seedream-5.0
        "1024-x-1024/qwen-image-2.0-pro":  qwen-image-2.0-pro
        veo-3.1-fast:                      veo-3.1-fast
  billing:
    topup-min-cents: ${TOPUP_MIN_CENTS:100}    # $1.00 floor
    topup-max-cents: ${TOPUP_MAX_CENTS:100000} # $1,000 ceiling per top-up
    currency:        ${BILLING_CURRENCY:usd}
    text-markup-percent:  ${TEXT_MARKUP_PERCENT:5}     # 5% platform fee on top of provider cost
    image-markup-percent: ${IMAGE_MARKUP_PERCENT:5}    # symmetric across modalities
    video-markup-percent: ${VIDEO_MARKUP_PERCENT:5}    # symmetric across modalities
  providers:
    openai:
      api-key:  ${OPENAI_API_KEY:sk_dev_dummy_openai_key_do_not_use_for_real_calls}
      api-base: ${OPENAI_API_BASE:https://api.openai.com}
      timeout:  ${OPENAI_TIMEOUT:30s}
    anthropic:
      api-key:     ${ANTHROPIC_API_KEY:sk_ant_dev_dummy_key_do_not_use_for_real_calls}
      api-base:    ${ANTHROPIC_API_BASE:https://api.anthropic.com}
      api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
      timeout:     ${ANTHROPIC_TIMEOUT:60s}
    google:
      api-key:  ${GOOGLE_API_KEY:google_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${GOOGLE_API_BASE:https://generativelanguage.googleapis.com}
      timeout:  ${GOOGLE_TIMEOUT:60s}
    bfl:
      api-key:       ${BFL_API_KEY:bfl_dev_dummy_key_do_not_use_for_real_calls}
      api-base:      ${BFL_API_BASE:https://api.bfl.ai}
      poll-interval: ${BFL_POLL_INTERVAL:2s}
      poll-timeout:  ${BFL_POLL_TIMEOUT:300s}     # 5 min — Flux Pro typically completes in <30s
    volcengine:
      # Shared Ark block — Doubao (text) + Seedream (image) + Seedance (video).
      api-key:       ${VOLCENGINE_API_KEY:volc_dev_dummy_key_do_not_use_for_real_calls}
      api-base:      ${VOLCENGINE_API_BASE:https://ark.cn-beijing.volces.com}
      poll-interval: ${VOLCENGINE_POLL_INTERVAL:5s}
      poll-timeout:  ${VOLCENGINE_POLL_TIMEOUT:600s}   # 10 min — video gen can be slow
    deepseek:
      api-key:  ${DEEPSEEK_API_KEY:deepseek_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${DEEPSEEK_API_BASE:https://api.deepseek.com}
      timeout:  ${DEEPSEEK_TIMEOUT:60s}
    moonshot:
      api-key:  ${MOONSHOT_API_KEY:moonshot_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${MOONSHOT_API_BASE:https://api.moonshot.ai}
      timeout:  ${MOONSHOT_TIMEOUT:60s}
    alibaba:
      # Shared block — Qwen (text) + Qwen-Image. DashScope OpenAI-compatible mode.
      api-key:  ${ALIBABA_API_KEY:alibaba_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${ALIBABA_API_BASE:https://dashscope-intl.aliyuncs.com/compatible-mode}
      timeout:  ${ALIBABA_TIMEOUT:60s}
    zhipu:
      api-key:  ${ZHIPU_API_KEY:zhipu_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${ZHIPU_API_BASE:https://open.bigmodel.cn/api/paas/v4}
      timeout:  ${ZHIPU_TIMEOUT:60s}
    minimax:
      api-key:  ${MINIMAX_API_KEY:minimax_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${MINIMAX_API_BASE:https://api.minimax.io}
      timeout:  ${MINIMAX_TIMEOUT:60s}
    xai:
      api-key:  ${XAI_API_KEY:xai_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${XAI_API_BASE:https://api.x.ai}
      timeout:  ${XAI_TIMEOUT:60s}
    baidu:
      api-key:  ${BAIDU_API_KEY:baidu_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${BAIDU_API_BASE:https://qianfan.baidubce.com/v2}
      timeout:  ${BAIDU_TIMEOUT:60s}
    stability:
      # Stability AI — SDXL image generation (v1 text-to-image, base64 artifacts).
      api-key:  ${STABILITY_API_KEY:stability_dev_dummy_key_do_not_use_for_real_calls}
      api-base: ${STABILITY_API_BASE:https://api.stability.ai}
      timeout:  ${STABILITY_TIMEOUT:90s}   # SDXL generation can take 20–40s
    kling:
      # Kling (Kuaishou) — async video; China-hosted, on the Alicloud allowlist.
      api-key:       ${KLING_API_KEY:kling_dev_dummy_key_do_not_use_for_real_calls}
      api-base:      ${KLING_API_BASE:https://api-singapore.klingai.com}
      poll-interval: ${KLING_POLL_INTERVAL:5s}
      poll-timeout:  ${KLING_POLL_TIMEOUT:600s}   # 10 min — video gen can be slow
    runway:
      # Runway (Gen-4) — async video; Western provider, never Alicloud-routed.
      api-key:       ${RUNWAY_API_KEY:runway_dev_dummy_key_do_not_use_for_real_calls}
      api-base:      ${RUNWAY_API_BASE:https://api.dev.runwayml.com}
      poll-interval: ${RUNWAY_POLL_INTERVAL:5s}
      poll-timeout:  ${RUNWAY_POLL_TIMEOUT:600s}   # 10 min — video gen can be slow
  gateway:
    fallback-chains:
      # primary model -> ordered list of fallbacks. Allowlist enforcement
      # re-runs per attempt; entries that fail it are silently skipped.
      gpt-4o:                       [gpt-4o-mini]
      gpt-4.1:                      [gpt-4o]
      claude-3-5-sonnet-20241022:   [claude-3-5-haiku-20241022, gpt-4o]
      gemini-1.5-pro:               [gemini-1.5-flash, gpt-4o-mini]
      # Smart tier
      gpt-5.5:                      [gpt-5.4, claude-sonnet-4-6]
      gpt-5.4:                      [claude-sonnet-4-6, gpt-4o]
      claude-opus-4-7:              [claude-sonnet-4-6, gpt-5.5]
      claude-sonnet-4-6:            [claude-haiku-4-5, gpt-5.4]
      gemini-3.1-pro:               [claude-sonnet-4-6, gpt-5.4]
      grok-4:                       [gpt-5.4, claude-sonnet-4-6]
      # Cheap / fast tier
      gpt-5.4-nano:                 [gemini-3.1-flash-lite, gpt-4o-mini]
      gemini-3.1-flash-lite:        [gpt-5.4-nano, gpt-4o-mini]
      claude-haiku-4-5:             [gpt-5.4-nano, gemini-3.1-flash-lite]
      # China-hosted tier — fallbacks stay China-hosted so they survive the Alicloud allowlist
      deepseek-v4-pro:              [deepseek-v4-flash, doubao-1.6-pro]
      deepseek-v4-flash:            [kimi-k2.6, qwen-3.6]
      doubao-1.6-pro:               [deepseek-v4-pro, qwen-3.6]
      kimi-k2.6:                    [deepseek-v4-flash, glm-4.7-flash]
      qwen-3.6:                     [deepseek-v4-flash, glm-4.7-flash]
      qwen-3.6-coder:               [qwen-3.6, deepseek-v4-pro]
      glm-4.7-flash:                [deepseek-v4-flash, qwen-3.6]
      minimax-m2.7:                 [deepseek-v4-flash, qwen-3.6]
      ernie-5.1:                    [deepseek-v4-pro, qwen-3.6]
      # Video tier — fallbacks stay same-region (Western↔Western, China↔China)
      veo-3.1:                      [veo-3.1-fast, sora-2]
      veo-3.1-fast:                 [sora-2, runway-gen4]
      sora-2:                       [runway-gen4, veo-3.1-fast]
      sora-2-pro:                   [veo-3.1, sora-2]
      runway-gen4:                  [sora-2, veo-3.1-fast]
      kling-3.0:                    [seedance-2.0, minimax-hailuo-2.3]
      seedance-2.0:                 [minimax-hailuo-2.3, kling-3.0]
      minimax-hailuo-2.3:           [seedance-2.0, kling-3.0]

logging:
  level:
    root: INFO
    ai.godance: DEBUG

# ---------------------------------------------------------------------------
# Quartz JDBC job store — dev/prod only. The JDBC SchedulerThread polls
# Postgres on a timer; under Testcontainers that poll outlives the database
# container during teardown. The `test` profile therefore uses the in-memory
# RAM store (application-test.yml), so these JDBC-only properties must not be
# bound when `test` is active — RAMJobStore has no setters for them.
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: "!test"
  quartz:
    jdbc:
      initialize-schema: never   # Flyway V8 owns the qrtz_* tables (auditable + rollback-safe)
    properties:
      org.quartz.jobStore.class:               org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: qrtz_
      org.quartz.jobStore.isClustered: "false"        # active-passive 2-region deploy; no clustering until S14+
      org.quartz.jobStore.useProperties: "false"
