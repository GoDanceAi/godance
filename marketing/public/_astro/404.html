<!doctype html>
<!--
  Cloudflare Pages answers a missing file under /_astro/ with this page, as a
  404 with Cache-Control: no-store, so nothing keeps the miss.

  It was added while the site had no top-level 404.html: Pages then answered
  a missing file with the home page and a 200, and the /_astro/* rule in
  _headers let that HTML be cached for a year in place of the stylesheet or
  script it stood in for. That can happen when a new file is requested before
  it has reached Cloudflare's edge; it did to the app on 2026-11-11.

  Pages uses the nearest 404.html, so this one only covers /_astro/. Every
  other unknown path gets the site's own page, src/pages/404.astro. Keep this
  one: a missing stylesheet or script should get these few bytes, not a page.
-->

<p>Not found.</p>
