# Submit the backend's resolved Maven dependency tree to GitHub's
# dependency graph, so Dependabot alerts cover it.
#
# GitHub's static pom.xml parser does not resolve versions managed by the
# Spring Boot parent BOM and does not walk transitives, so without this the
# Security tab shows no backend alerts at all — Netty, Jackson, Spring
# Framework/Security, logback and the JDBC driver are all invisible. See
# docs/dependency-triage-2026-09.md. This action resolves the full tree with
# Maven and submits it as a snapshot; Dependabot then raises alerts against
# it like any other manifest.
#
# Runs on every push to main (the snapshot Dependabot alerts on is main's)
# and needs contents: write to submit, which is why it is not part of the
# read-only PR workflow (ci.yml).

name: Dependency graph (backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  maven:
    name: submit Maven dependency snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: backend
