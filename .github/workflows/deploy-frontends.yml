# Frontend CI/CD — build the SPA + marketing site and deploy to Cloudflare
# Pages on every push to main that touches them.
#
# This closes the "merged but never deployed" gap: the backend has had
# auto-deploy since Session 15 while the frontends relied on someone
# remembering to run wrangler — which is how prod went 6 weeks stale
# (May 21 merges undeployed until July).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages — Edit"
#                            permission (My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID  — dash.cloudflare.com → right sidebar of any
#                            zone, or the URL after /accounts/
#
# Until those secrets exist the deploy steps fail harmlessly; the build
# steps still validate every push.
#
# Both sites deploy on any trigger of this workflow (a no-change redeploy
# is cheap and idempotent) — simpler and safer than per-site path filters.

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'marketing/**'
      - '.github/workflows/deploy-frontends.yml'
  workflow_dispatch:

concurrency:
  group: frontend-cicd
  cancel-in-progress: false

jobs:
  deploy-app:
    name: app.godance.ai (SPA)
    runs-on: ubuntu-latest
    outputs:
      # The script this build's index.html loads, e.g. /assets/index-AbC123.js.
      # The smoke job waits until the live site serves it.
      bundle: ${{ steps.build.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        id: build
        working-directory: app
        env:
          VITE_API_URL: https://api.godance.ai
        # Lint and audit as ci.yml does, so a push that skipped a PR can't
        # release what the PR gate would have stopped.
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
          re='src="(/assets/[^"]+\.js)"'
          [[ $(<dist/index.html) =~ $re ]] || { echo "no /assets/*.js bundle in dist/index.html" >&2; exit 1; }
          echo "bundle=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # The app signs in through the API's session cookie, and one merge can
      # change both: this workflow finishes well before the backend's, and an
      # app ahead of its API can't sign anyone in. So wait until the API accepts
      # the app's X-Godance-Session header, which only a backend with the cookie
      # does. An app behind its API is fine: the API still serves old bundles.
      # A preflight needs no credentials and changes nothing.
      - name: Wait for an API with the session cookie
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://app.godance.ai' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: x-godance-session' \
              https://api.godance.ai/v1/auth/login || true)
            if [ "$status" = "200" ]; then
              echo "API ready"; exit 0
            fi
            echo "waiting ($i): preflight answered '$status'"
            sleep 30
          done
          echo "the API never accepted the session header; not deploying the app" >&2
          exit 1
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name godance-app --branch main

  deploy-marketing:
    name: godance.ai (marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Build
        working-directory: marketing
        env:
          SITE_URL: https://godance.ai
          PUBLIC_API_BASE: https://api.godance.ai
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: marketing
          command: pages deploy dist --project-name godance-marketing --branch main

  # Post-deploy smoke: the two features whose absence went unnoticed for
  # six weeks. Fails the run loudly if the deployed bundle regresses.
  smoke:
    needs: [deploy-app, deploy-marketing]
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages can answer 502 for a few seconds right after a
      # deploy. Retry transient errors (5xx, timeouts, refused) for about a
      # minute so that window doesn't fail the run; a real outage still does.
      CURL_RETRY: --retry 6 --retry-delay 10 --retry-connrefused
    # Each page is fetched into a variable and grepped from a here-string,
    # never piped: `grep -q` exits on the first match, which breaks a pipe
    # (curl error 23, echo SIGPIPE) and fails the step under pipefail. It
    # also lets a curl error fail the step as itself, not as a missing string.
    steps:
      # A deploy reports complete before its new files reach every Cloudflare
      # edge. Until they do, the new index.html can be live while its bundle
      # isn't, and the SPA fallback answers the bundle's URL with index.html,
      # which the /assets/* rule in _headers lets the edge cache for a year.
      # This step once fetched the bundle 14 s after the deploy and left that
      # HTML cached in its place, blanking the app (2026-11-11). So it never
      # fetches the bundle's own URL: each try adds a query string, which the
      # edge caches under its own key, so an early answer spoils nothing.
      - name: SPA serves this build's bundle, with USDT rail + admin console
        env:
          BUNDLE: ${{ needs.deploy-app.outputs.bundle }}
        run: |
          echo "bundle: $BUNDLE"
          for i in $(seq 1 30); do
            HTML=$(curl -fsS $CURL_RETRY https://app.godance.ai)
            if [[ $HTML != *"src=\"$BUNDLE\""* ]]; then
              echo "waiting ($i): the live index.html doesn't load this build's bundle yet"
            else
              # A 404 or 5xx counts as not there yet: --fail would end the step.
              TYPE=$(curl -sS $CURL_RETRY -o bundle.js -w '%{http_code} %{content_type}' \
                "https://app.godance.ai$BUNDLE?smoke=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.$i")
              [[ $TYPE == "200 "*javascript* ]] && break
              echo "waiting ($i): the bundle answered '$TYPE'"
            fi
            [ "$i" -lt 30 ] || { echo "this build's bundle never went live" >&2; exit 1; }
            sleep 10
          done
          JS=$(<bundle.js)
          grep -qi "usdt" <<<"$JS"     || { echo "USDT missing from deployed bundle" >&2; exit 1; }
          # save_card was asserted here originally, but it is a backend-only
          # string (Stripe auto-recharge) that has never been in the SPA
          # bundle — the check could never pass. v1/admin proves the admin
          # console (round 5) is in the deployed bundle.
          grep -q "v1/admin" <<<"$JS"  || { echo "admin console missing from deployed bundle" >&2; exit 1; }
      - name: Marketing mentions USDT
        run: |
          PAGE=$(curl -fsS $CURL_RETRY https://godance.ai)
          grep -qi "usdt" <<<"$PAGE" || { echo "USDT copy missing from marketing" >&2; exit 1; }
