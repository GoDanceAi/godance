# Backend CI/CD — test, build a container image, push to GHCR, deploy.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          — droplet IP / hostname (e.g. 162.243.185.89)
#   SSH_USER          — droplet SSH user (e.g. root)
#   SSH_PRIVATE_KEY   — private key whose public half is in the droplet's
#                       authorized_keys
#
# GHCR: the image is pushed with the built-in GITHUB_TOKEN and stays a
# private package. The deploy job logs the droplet into ghcr.io using the
# workflow token (valid for that run only) so `docker compose pull` can
# fetch it — no manual registry setup needed.
#
# Until the SSH secrets exist, the `deploy` job fails harmlessly — `test`
# and `build-and-push` still validate every push.

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/backing-services/**'
  workflow_dispatch:

concurrency:
  group: backend-cicd
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/godanceai/godance-backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # MinIO (built from source — no public image exists any more) + Redis.
      # Shared with ci.yml; see the action for details.
      - uses: ./.github/actions/backing-services
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify
      # The same dependency scan the PR checks run (ci.yml), so a push to main
      # that skipped a PR cannot release a build the PR gate would have stopped.
      - name: OSV scan
        working-directory: backend
        run: |
          mvn -B -q dependency:list -DoutputFile=target/deps.txt -DoutputAbsoluteArtifactFilename=false
          python3 dev/osv-scan.py target/deps.txt

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deploy/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,BACKEND_TAG
          script: |
            set -euo pipefail
            # The GHCR image is a private package — log in with the workflow's
            # own token (valid for this run only) so `docker compose pull`
            # can fetch it, then log out.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/godance
            # Move to exactly the commit this run built, not to whatever main
            # is by now, so the compose file and the image come from one revision.
            git fetch --quiet origin main
            git merge --ff-only "$BACKEND_TAG"
            cd backend
            # Pins the compose image to this commit's build (:<sha>, not :latest).
            export BACKEND_TAG
            # The droplet's connection to GHCR's blob storage occasionally
            # times out mid-pull. Retry with backoff (10/20/30/40s) before
            # failing; the running container is untouched until `up`.
            for attempt in 1 2 3 4 5; do
              if docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull backend; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "image pull failed after $attempt attempts" >&2
                exit 1
              fi
              echo "image pull failed (attempt $attempt/5); retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
            done
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --no-build backend
            docker logout ghcr.io
            docker image prune -f
      # Passes only when the API serves this run's commit and its health,
      # which covers PostgreSQL and Redis, is UP. Any 200 from /healthz used to
      # pass, so a stale image or a down database still reported success.
      - name: Verify the deployed revision
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            sha=$(curl -fsS https://api.godance.ai/healthz | jq -r .git_sha || true)
            health=$(curl -fsS https://api.godance.ai/actuator/health | jq -r .status || true)
            if [ "$sha" = "$want" ] && [ "$health" = "UP" ]; then
              echo "serving $sha, health UP"; exit 0
            fi
            echo "waiting ($i): serving '${sha:-none}', health '${health:-none}', want $want"
            sleep 6
          done
          echo "the API is not serving $want with health UP" >&2
          exit 1
