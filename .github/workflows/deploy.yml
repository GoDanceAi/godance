# Backend CI/CD — test, build a container image, push to GHCR, deploy.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          — droplet IP / hostname (e.g. 162.243.185.89)
#   SSH_USER          — droplet SSH user (e.g. root)
#   SSH_PRIVATE_KEY   — private key whose public half is in the droplet's
#                       authorized_keys
#
# GHCR: the image is pushed with the built-in GITHUB_TOKEN and stays a
# private package. The deploy job logs the droplet into ghcr.io using the
# workflow token (valid for that run only) so `docker compose pull` can
# fetch it — no manual registry setup needed.
#
# Until the SSH secrets exist, the `deploy` job fails harmlessly — `test`
# and `build-and-push` still validate every push.

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-cicd
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/godanceai/godance-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The @SpringBootTest integration tests boot the full context, which
      # eagerly connects to object storage and uses Redis. Postgres is
      # supplied per-test by Testcontainers; MinIO + Redis are not, so the
      # workflow provides them — mirroring the local dev docker-compose.
      - name: Start backing services (MinIO + Redis)
        run: |
          docker run -d --name redis -p 6380:6379 redis:7-alpine
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=godance -e MINIO_ROOT_PASSWORD=godancepw \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "MinIO ready"; break
            fi
            if [ "$i" = 30 ]; then echo "MinIO not ready" >&2; docker logs minio; exit 1; fi
            sleep 1
          done
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deploy/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            # The GHCR image is a private package — log in with the workflow's
            # own token (valid for this run only) so `docker compose pull`
            # can fetch it, then log out.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/godance
            git pull --ff-only
            cd backend
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull backend
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --no-build backend
            docker logout ghcr.io
            docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://api.godance.ai/healthz >/dev/null; then
              echo "healthz OK"; exit 0
            fi
            echo "waiting for healthz ($i)…"; sleep 6
          done
          echo "healthz did not recover"; exit 1
