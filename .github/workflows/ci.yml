# CI — build and test every surface on pull requests and feature branches.
#
# deploy.yml and deploy-frontends.yml only run on pushes to main, so until
# this workflow existed an open PR never got a CI run. This runs the same
# build and test steps they gate deploys on, and deploys nothing:
#
#   backend    — mvn -B verify against MinIO + Redis (the shared
#                backing-services action, identical to deploy.yml's test job),
#                then the OSV scan (backend/dev/osv-scan.py)
#   app        — npm ci && npm run lint && npm run build && npm audit
#   app (e2e)  — Playwright browser journeys (app/e2e/), desktop and mobile
#                Chromium, against a build of the app with every API call
#                mocked in the browser: no backend, nothing beyond localhost
#   marketing  — npm ci && npm run lint && npm run build && npm audit
#
# npm audit and the OSV scan run last and fail on high or critical findings;
# they still list low and moderate ones in the log. A newly published
# advisory can turn them red on a PR that didn't cause it; the tests, Lint
# and Build have already reported by then.
#
# No secrets: the only credential is the default, read-only GITHUB_TOKEN,
# so PRs from forks run exactly like PRs from branches in this repo.
#
# A branch that has an open PR gets two runs per push (push +
# pull_request). That is deliberate: the push run covers branches without
# a PR yet, and the pull_request run tests the merge with main.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/backing-services
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify
      # The resolved Maven tree, including BOM-managed and transitive
      # versions, checked against osv.dev. Fails on high, critical or
      # unrated advisories.
      - name: OSV scan
        working-directory: backend
        run: |
          mvn -B -q dependency:list -DoutputFile=target/deps.txt -DoutputAbsoluteArtifactFilename=false
          python3 dev/osv-scan.py target/deps.txt

  app:
    name: app (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      # tsc -b over the tsconfig projects (src/, vite.config.ts and the
      # e2e suite).
      - name: Lint
        working-directory: app
        run: npm run lint
      # Same env as the deploy build, so CI builds what would ship.
      - name: Build
        working-directory: app
        env:
          VITE_API_URL: https://api.godance.ai
        run: npm run build
      - name: Audit
        working-directory: app
        run: npm audit --audit-level=high

  app-e2e:
    name: app (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      # Both projects (desktop Chrome, Pixel 7) run on Chromium, so one
      # browser; --with-deps adds the system libraries it needs.
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app with VITE_API_URL at a fake
      # origin and serves it with vite preview; the specs mock the API.
      - name: Browser journeys
        working-directory: app
        run: npm run test:e2e
      # Traces of the failed tests are inside the report.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  marketing:
    name: marketing (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Install
        working-directory: marketing
        run: npm ci
      # astro check typechecks the .astro and .ts files; astro build
      # does not.
      - name: Lint
        working-directory: marketing
        run: npm run lint
      - name: Build
        working-directory: marketing
        env:
          SITE_URL: https://godance.ai
          PUBLIC_API_BASE: https://api.godance.ai
        run: npm run build
      - name: Audit
        working-directory: marketing
        run: npm audit --audit-level=high
