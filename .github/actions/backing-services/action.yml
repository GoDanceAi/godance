# Backing services for the backend test suite: MinIO + Redis.
#
# The @SpringBootTest integration tests boot the full context, which eagerly
# connects to object storage and uses Redis. Postgres is supplied per-test by
# Testcontainers; MinIO + Redis are not, so this action provides them on the
# ports and credentials application.yml defaults to — the same pair
# backend/docker-compose.yml runs locally.
#
# MinIO withdrew its public images from Docker Hub and Quay in 2025, so it is
# built from source (backend/dev/minio/Dockerfile). The build is cached in
# the GitHub Actions cache, so only a run that misses the cache pays the
# few-minute compile. The image is loaded under the same local tag the
# Testcontainers tests use (MinioTestImage), so they reuse it as-is.
#
# Shared by ci.yml (pull requests) and deploy.yml (main) so the two cannot
# drift. Needs only the default GITHUB_TOKEN — no registry login.

name: Backend backing services
description: Build MinIO from source and start MinIO + Redis for the backend tests

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - name: Build MinIO from source
      uses: docker/build-push-action@v6
      with:
        context: backend/dev/minio
        tags: localhost/godance/minio:RELEASE.2024-12-13T22-19-12Z
        load: true
        # mode=max also caches the builder stage, which is the expensive part.
        # ignore-error: a failed cache write must never fail the tests.
        cache-from: type=gha,scope=minio
        cache-to: type=gha,scope=minio,mode=max,ignore-error=true
    - name: Start backing services (MinIO + Redis)
      shell: bash
      run: |
        docker run -d --name redis -p 6380:6379 redis:7-alpine
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER=godance -e MINIO_ROOT_PASSWORD=godancepw \
          localhost/godance/minio:RELEASE.2024-12-13T22-19-12Z server /data
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
            echo "MinIO ready"; break
          fi
          if [ "$i" = 30 ]; then echo "MinIO not ready" >&2; docker logs minio; exit 1; fi
          sleep 1
        done
